# Source:     ~/.config/starship/CYBRship.toml
# ---------------------------------------

scan_timeout = 100

format = """
$username\
[](fg:color8 bg:color2)\
$shell\
[](fg:color8 bg:color3)\
$directory\
[](fg:color8)\
$git_branch\
$git_status\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nim\
$rust\
$scala\
$docker_context\
$time\
$line_break\
${custom.git_last_commit_date}\
${custom.git_last_commit_message}\
$character
"""

palette = "wal"

[username]
show_always = true
style_user = "bg:color2 fg:color1"
format = '[ $user ]($style)'
disabled = false

[shell]
style = "bg:color3 fg:color0"
format = '[ $indicator ]($style)'
disabled = false

[directory]
style = "fg:re2 bg:re0"
format = "[ $path ](bold $style)"
truncation_length = 3
truncation_symbol = "…/"

[line_break]
disabled = false

[jobs]
disabled = true

[character]
success_symbol = "[❯ ](fg:re0)"
error_symbol = "[](fg:re0)"
vicmd_symbol = "[󰆤](fg:ye0)"
format = "$symbol"

[time]
disabled = true
time_format = "%R" # Hour:Minute Format
style = "fg:cy0 bg:cy2"
format = '[󱎕](fg:cy2)[ $time ]($style)[](fg:cy2)'

[custom.time_arrow]
disabled = false
command = 'echo -n "󱎕"'
when = 'true'
style = "fg:cy2"
format = '[ $output]($style)'

[custom.transient_time]
disabled = false
command = 'date "+%H:%M"'
when = 'true'
style = "fg:cy0 bg:cy2"
format = '[ $output ]($style)'

[git_branch]
symbol = ""
style = "bg:pu2 fg:pu0"
format = "[󱎕](fg:pu2)[ $symbol $branch ]($style)[](fg:pu2)"

[git_status]
style = "bg:pu0 fg:pu2"   # hlavní blok
format = "[󱎕](fg:pu0)[ $all_status$ahead_behind ]($style)[](fg:pu0)"

[custom.git_last_commit_date]
command = 'git log -1 --pretty="format:%ad" --date="format:%d-%m-%Y"'
when =  'git rev-parse --is-inside-work-tree 2> /dev/null'
style = "bg:bl2 fg:bl0"
format = "[ $output ]($style)[](bg:gr2 fg:bl2)"

[custom.git_last_commit_message]
command = 'git log -1 --pretty="format:%B"'
when =  'git rev-parse --is-inside-work-tree 2> /dev/null'
style = "bg:gr2 fg:gr0"
format = "[ $output ]($style)[](fg:gr2)\n"

[c]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[](fg:pu2 bg:bl2)[ $symbol ($version) ]($style)"

[cpp]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[ $symbol ($version) ]($style)"

[elm]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[ $symbol ($version) ]($style)"

[gradle]
style = "bg:cy2 fg:cy0"
format = "[](fg:bl2 bg:cy2)[ $symbol ($version) ]($style)"

[julia]
symbol = ""
style = "bg:cy2 fg:cy0"
format = "[ $symbol ($version) ]($style)"

[java]
symbol = ""
style = "bg:or2 fg:or0"
format = "[](fg:cy2 bg:or2)[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "bg:or2 fg:or0"
format = "[ $symbol ($version) ]($style)"

[python]
symbol = ""
style = "bg:ye2 fg:ye0"
format = "[](fg:or2 bg:ye2)[ $symbol ($version) ]($style)"

[nim]
symbol = "󰆥"
style = "bg:ye2 fg:ye0"
format = "[ $symbol ($version) ]($style)"

[haskell]
symbol = ""
style = "bg:pu2 fg:pu0"
format = "[](fg:ye2 bg:pu2)[ $symbol ($version) ]($style)"

[elixir]
symbol = ""
style = "bg:pu2 fg:pu0"
format = "[ $symbol ($version) ]($style)"

[scala]
symbol = ""
style = "bg:re2 fg:re0"
format = "[](fg:pu2 bg:re2)[ $symbol ($version) ]($style)"

[docker_context]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[](fg:re2 bg:bl2)[ $symbol $context ]($style)"
